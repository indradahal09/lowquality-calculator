<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-container">
        <div class="display-calculations">
            <div class="calculation-display js-display-calculations"></div>
            <div class="result-display js-display-result"></div>
        </div>

        <div>
            <button class="calc-buttons js-c-button">C</button>
            <button class="calc-buttons js-del-button">Del</button>
            <button class="calc-buttons js-calc-buttons">%</button>
            <button class="calc-buttons operation-button js-divide-button">/</button>
        </div>

        <div>
            <button class="calc-buttons js-calc-buttons">7</button>
            <button class="calc-buttons js-calc-buttons">8</button>
            <button class="calc-buttons js-calc-buttons">9</button>
            <button class="calc-buttons operation-button js-multiply-button">&times;</button>
        </div>

        <div>
            <button class="calc-buttons js-calc-buttons">4</button>
            <button class="calc-buttons js-calc-buttons">5</button>
            <button class="calc-buttons js-calc-buttons">6</button>
            <button class="calc-buttons operation-button js-subtract-button">-</button>
        </div>

        <div>
            <button class="calc-buttons js-calc-buttons">1</button>
            <button class="calc-buttons js-calc-buttons">2</button>
            <button class="calc-buttons js-calc-buttons">3</button>
            <button class="calc-buttons operation-button js-addition-button">+</button>
        </div>

        <div>
            <button class="calc-buttons zero-button js-calc-buttons">0</button>
            <button class="calc-buttons js-calc-buttons">,</button>
            <button class="calc-buttons operation-button js-equal-button">=</button>
        </div>

    </div>

    
    <script src="script.js"></script>
</body>
</html>
